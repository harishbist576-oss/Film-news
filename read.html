<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- Dynamic Open Graph Meta Tags -->
    <meta property="og:title" id="metaTitle" content="Film News">
    <meta property="og:description" id="metaDesc" content="Film News - Your Trusted News Portal">
    <meta property="og:image" id="metaImage" content="https://picsum.photos/800/400">
    <meta property="og:url" id="metaUrl" content="">

    <!-- Twitter / X Card Meta Tags -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" id="twitterTitle" content="Film News">
    <meta name="twitter:description" id="twitterDesc" content="Film News - Your Trusted News Portal">
    <meta name="twitter:image" id="twitterImage" content="https://picsum.photos/800/400">

    <title id="pageTitle">News Detail - Film News</title>
    
    <!-- Mukta Font -->
    <link href="https://fonts.googleapis.com/css2?family=Mukta:wght@700;800&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Mukta', Arial, sans-serif; }
        
        body { background-color: #0d1117; color: #f0f6fc; display: flex; flex-direction: column; min-height: 100vh; }
        
        header { background-color: #161b22; padding: 18px 30px; display: flex; justify-content: center; align-items: center; border-bottom: 4px solid #f39c12; width: 100%; }
        .header-category-only { font-size: 24px; font-weight: 800; color: #ffffff; text-decoration: none; text-transform: uppercase; letter-spacing: 1px; }
        
        .container { 
            width: 100%; 
            max-width: 850px; 
            margin: 20px auto; 
            padding: 0 8px; 
            flex: 1;
        }

        .back-btn { 
            background-color: #161b22; 
            color: white; 
            padding: 9px 18px; 
            border-radius: 6px; 
            border: 1px solid #30363d; 
            cursor: pointer; 
            font-weight: 800; 
            margin-bottom: 20px; 
            display: inline-block; 
            text-decoration: none; 
            font-size: 15px;
        }
        .back-btn:hover { background-color: #f39c12; border-color: #f39c12; }

        .detail-title { 
            font-size: 30px; 
            color: #ffffff; 
            margin-bottom: 15px; 
            line-height: 1.4; 
            font-weight: 800;
            width: 100%;
        }

        .detail-meta-box { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            border-bottom: 2px solid #30363d; 
            border-top: 2px solid #30363d;
            padding: 12px 0; 
            margin-bottom: 25px; 
            font-size: 15px; 
            color: #8b949e; 
            font-weight: 800;
        }

        .detail-img { 
            width: 100%; 
            max-height: 480px; 
            object-fit: cover; 
            border-radius: 10px; 
            margin-bottom: 25px; 
            border: 1px solid #30363d;
        }

        /* Content Card */
        .content-card {
            background-color: #ffffff;
            border: 1px solid #d0d7de;
            border-radius: 12px;
            padding: 24px 20px;
            margin-bottom: 20px;
            font-size: 22px;
            color: #24292f;
            line-height: 1.9;
            font-weight: 700;
            width: 100%;
            text-align: justify;
            word-break: normal;
            overflow-wrap: break-word;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .content-card p {
            margin-bottom: 18px;
            width: 100%;
        }
        .content-card p:last-child {
            margin-bottom: 0;
        }

        /* Ad Box */
        .ad-box {
            border: 2px dashed #484f58;
            background-color: #161b22;
            text-align: center;
            padding: 20px;
            color: #8b949e;
            font-size: 16px;
            font-weight: 800;
            margin: 20px 0;
            border-radius: 10px;
        }

        /* Share & Views Stats Box */
        .stats-share-container {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 10px;
            padding: 15px 20px;
            margin: 25px 0;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 15px;
        }

        .stats-area {
            display: flex;
            gap: 25px;
        }

        .stat-item {
            display: flex;
            flex-direction: column;
            color: #ffffff;
        }

        .stat-number {
            font-size: 24px;
            font-weight: 800;
            color: #f39c12;
            line-height: 1;
        }

        .stat-text {
            font-size: 13px;
            font-weight: 800;
            color: #8b949e;
            text-transform: uppercase;
            margin-top: 4px;
        }

        .share-buttons-grid {
            display: flex;
            gap: 4px;
            border-radius: 6px;
            overflow: hidden;
        }

        .s-btn {
            width: 52px;
            height: 48px;
            display: flex;
            justify-content: center;
            align-items: center;
            color: white;
            text-decoration: none;
            font-size: 20px;
            font-weight: bold;
            border: none;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .s-btn:hover { opacity: 0.85; }

        .sb-fb { background-color: #3b5998; }
        .sb-tg { background-color: #0088cc; border-left: 1px solid #222; border-right: 1px solid #222; }
        .sb-wa { background-color: #25d366; }
        .sb-more { background-color: #88cc44; }

        /* Related News Section */
        .related-section {
            margin-top: 40px;
            padding-top: 20px;
            border-top: 3px solid #30363d;
        }
        .related-heading {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 18px;
            border-left: 5px solid #f39c12;
            padding-left: 10px;
        }
        .related-card {
            display: flex;
            gap: 15px;
            background: #161b22;
            padding: 12px;
            border-radius: 10px;
            text-decoration: none;
            color: inherit;
            border: 1px solid #30363d;
            margin-bottom: 12px;
            align-items: center;
            transition: border-color 0.2s, transform 0.2s;
        }
        .related-card:hover {
            border-color: #f39c12;
            transform: translateX(3px);
        }
        .related-thumb {
            width: 120px;
            height: 85px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            border: 1px solid #30363d;
        }
        .related-info {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .related-cat {
            font-size: 12px;
            color: #f39c12;
            font-weight: 800;
            text-transform: uppercase;
            margin-bottom: 4px;
        }
        .related-title {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            line-height: 1.4;
        }

        /* Custom Popup */
        .custom-popup-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.75); display: flex; justify-content: center; align-items: center;
            z-index: 9999; opacity: 0; visibility: hidden; transition: 0.3s;
        }
        .custom-popup-overlay.active { opacity: 1; visibility: visible; }
        .custom-popup-box {
            background: #161b22; padding: 25px; border-radius: 12px; text-align: center; max-width: 320px; width: 90%;
            border-top: 4px solid #f39c12; color: #fff; border: 1px solid #30363d;
        }
        .custom-popup-btn {
            background-color: #f39c12; color: white; border: none; padding: 9px 22px; font-weight: 800; border-radius: 6px; cursor: pointer; margin-top: 15px;
        }

        footer { background-color: #161b22; color: #8b949e; text-align: center; padding: 25px; margin-top: 40px; font-size: 14px; border-top: 1px solid #30363d; }
    </style>
</head>
<body>

    <header>
        <a href="index.html" id="headerCategoryOnly" class="header-category-only">FILM NEWS</a>
    </header>

    <div class="container">
        <a href="index.html" class="back-btn">&larr; Back to Home</a>
        
        <div id="newsDetailContainer">
            <p style="text-align:center; color:#8b949e; font-size: 18px; padding: 40px; font-weight: 800;">Loading news...</p>
        </div>
    </div>

    <div id="customPopup" class="custom-popup-overlay">
        <div class="custom-popup-box">
            <div style="font-size: 18px; font-weight: 800; margin-bottom: 10px;">Link copied successfully!</div>
            <button class="custom-popup-btn" onclick="closeCustomPopup()">OK</button>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Film News. All rights reserved.</p>
    </footer>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, doc, getDoc, updateDoc, increment, collection, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
          apiKey: "AIzaSyDLn2oGT-rIZjcvKxbcCedfPBalpIDsaJw",
          authDomain: "filmynews-3ba45.firebaseapp.com",
          projectId: "filmynews-3ba45",
          storageBucket: "filmynews-3ba45.firebasestorage.app",
          messagingSenderId: "902647197974",
          appId: "1:902647197974:web:3eec0940b8ec56bf22e037"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let currentNewsId = null;
        let currentNewsData = null;

        // Increment Views Realtime
        async function incrementViews(newsId) {
            try {
                const newsRef = doc(db, "news", newsId);
                await updateDoc(newsRef, {
                    views: increment(1)
                });
            } catch (err) {
                console.error("Error updating views: ", err);
            }
        }

        // Handle Share Function
        window.handleShare = async function(platform) {
            if (!currentNewsId) return;

            try {
                const docRef = doc(db, "news", currentNewsId);
                await updateDoc(docRef, {
                    shareCount: increment(1)
                });

                const countElem = document.getElementById('shareCountNum');
                if(countElem) {
                    let currentCount = parseInt(countElem.textContent) || 0;
                    countElem.textContent = currentCount + 1;
                }
            } catch (error) {
                console.error("Error updating share count:", error);
            }

            const pageUrl = window.location.href;
            const newsTitle = currentNewsData ? currentNewsData.title : document.title;
            const mainPoint = currentNewsData && currentNewsData.content ? currentNewsData.content.substring(0, 90) + '...' : '';
            
            const shareTextFormatted = `📢 *${newsTitle}*\\n\\n🔥 Summary: ${mainPoint}\\n\\nRead full details: `;

            if (platform === 'fb') {
                window.open(`https://facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}`, '_blank');
            } else if (platform === 'tg') {
                window.open(`https://t.me/share/url?url=${encodeURIComponent(pageUrl)}&text=${encodeURIComponent(shareTextFormatted)}`, '_blank');
            } else if (platform === 'wa') {
                window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(shareTextFormatted)}%20${encodeURIComponent(pageUrl)}`, '_blank');
            } else if (platform === 'more') {
                document.getElementById('customPopup').classList.add('active');
                navigator.clipboard.writeText(pageUrl);
            }
        }

        window.closeCustomPopup = function() {
            document.getElementById('customPopup').classList.remove('active');
        }

        // Generate content with ads
        function generateContentWithAds(text, wordLimit = 50) {
            const words = text.split(/\s+/);
            if (words.length <= wordLimit) {
                return `<div class="content-card"><p>${text}</p></div>`;
            }

            let htmlOutput = '';
            for (let i = 0; i < words.length; i += wordLimit) {
                let chunk = words.slice(i, i + wordLimit).join(' ');

                htmlOutput += `
                    <div class="content-card">
                        <p>${chunk}</p>
                    </div>
                `;
                
                if (i + wordLimit < words.length) {
                    htmlOutput += `
                        <div class="ad-box">
                        </div>
                    `;
                }
            }
            return htmlOutput;
        }

        async function loadNewsDetail() {
            const urlParams = new URLSearchParams(window.location.search);
            const newsId = urlParams.get('id');
            currentNewsId = newsId;
            const container = document.getElementById('newsDetailContainer');
            const headerCategoryOnly = document.getElementById('headerCategoryOnly');

            if (!newsId) {
                headerCategoryOnly.textContent = "FILM NEWS";
                container.innerHTML = `<h2 style="color:#ff7b72; text-align:center; font-weight:900;">News not found!</h2>`;
                return;
            }

            try {
                await incrementViews(newsId);

                const docRef = doc(db, "news", newsId);
                const docSnap = await getDoc(docRef);

                if (docSnap.exists()) {
                    currentNewsData = docSnap.data();
                    headerCategoryOnly.textContent = currentNewsData.category || "FILM NEWS";

                    // Meta Tags
                    document.getElementById('pageTitle').textContent = currentNewsData.title + " - Film News";
                    document.getElementById('metaTitle').setAttribute('content', currentNewsData.title);
                    document.getElementById('metaDesc').setAttribute('content', currentNewsData.content ? currentNewsData.content.substring(0, 100) + '...' : '');
                    document.getElementById('metaImage').setAttribute('content', currentNewsData.image || 'https://picsum.photos/800/400');
                    document.getElementById('metaUrl').setAttribute('content', window.location.href);

                    document.getElementById('twitterTitle').setAttribute('content', currentNewsData.title);
                    document.getElementById('twitterDesc').setAttribute('content', currentNewsData.content ? currentNewsData.content.substring(0, 100) + '...' : '');
                    document.getElementById('twitterImage').setAttribute('content', currentNewsData.image || 'https://picsum.photos/800/400');

                    const totalShares = currentNewsData.shareCount || 0;
                    const totalViews = currentNewsData.views || 1;

                    // Related news list
                    const querySnapshot = await getDocs(collection(db, "news"));
                    let allNewsHtml = `
                        <div class="related-section">
                            <h3 class="related-heading">Related News</h3>
                    `;
                    
                    querySnapshot.forEach((d) => {
                        const data = d.data();
                        allNewsHtml += `
                            <a href="read.html?id=${d.id}" class="related-card">
                                <img src="${data.image || 'https://picsum.photos/800/400'}" class="related-thumb" alt="Thumbnail">
                                <div class="related-info">
                                    <span class="related-cat">${data.category || 'News'}</span>
                                    <h4 class="related-title">${data.title}</h4>
                                </div>
                            </a>
                        `;
                    });
                    allNewsHtml += `</div>`;

                    let contentText = currentNewsData.content || '';
                    let formattedContent = generateContentWithAds(contentText, 50);

                    container.innerHTML = `
                        <h1 class="detail-title">${currentNewsData.title}</h1>
                        
                        <div class="detail-meta-box">
                            <span>Author: ${currentNewsData.author || 'Admin'}</span>
                            <span>Category: ${currentNewsData.category || 'General'}</span>
                        </div>

                        <img src="${currentNewsData.image || 'https://picsum.photos/800/400'}" class="detail-img" alt="News Image">

                        ${formattedContent}

                        <!-- Stats & Share Bar -->
                        <div class="stats-share-container">
                            <div class="stats-area">
                                <div class="stat-item">
                                    <span class="stat-number">${totalViews}</span>
                                    <span class="stat-text">👁️ Views</span>
                                </div>
                                <div class="stat-item">
                                    <span class="stat-number" id="shareCountNum">${totalShares}</span>
                                    <span class="stat-text">Shares</span>
                                </div>
                            </div>
                            <div class="share-buttons-grid">
                                <button onclick="handleShare('fb')" class="s-btn sb-fb" title="Facebook">f</button>
                                <button onclick="handleShare('tg')" class="s-btn sb-tg" title="Telegram">✈</button>
                                <button onclick="handleShare('wa')" class="s-btn sb-wa" title="WhatsApp">📞</button>
                                <button onclick="handleShare('more')" class="s-btn sb-more" title="Copy Link / More">🔗</button>
                            </div>
                        </div>

                        ${allNewsHtml}
                    `;
                } else {
                    headerCategoryOnly.textContent = "FILM NEWS";
                    container.innerHTML = `<h2 style="color:#ff7b72; text-align:center; font-weight:900;">News not found!</h2>`;
                }
            } catch (error) {
                console.error("Error loading news detail:", error);
                container.innerHTML = `<h2 style="color:#ff7b72; text-align:center; font-weight:900;">Error loading page</h2>`;
            }
        }

        loadNewsDetail();
    </script>
</body>
</html>
